[package]
name = "kaonic-vpn"
version = "0.1.0"
description = "kaonic-hub's mesh VPN: IPv4 over authenticated mesh links, through a TUN device"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaonic-mesh = { path = "../kaonic-mesh" }
kaonic-mux = { path = "../kaonic-mux" }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"] }

# Multicast and broadcast sockets for client networks (`lan`).
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"] }
# Emulated radio and test keys, to run several nodes in one test.
kaonic-air = { path = "../kaonic-air" }
kaonic-handshake = { path = "../kaonic-handshake" }
kaonic-mesh = { path = "../kaonic-mesh" }
kaonic-pki = { path = "../kaonic-pki" }
kaonic-trust = { path = "../kaonic-trust" }
reticulum = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
