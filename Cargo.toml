[workspace]
resolver = "3"
members = ["kaonic-handshake", "kaonic-hub", "kaonic-hub-common", "kaonic-hub-installer", "kaonic-hub-plugin", "kaonic-keystore", "kaonic-mesh", "kaonic-mux", "kaonic-pki", "kaonic-ptt", "kaonic-sim-air", "kaonic-store", "kaonic-trust", "kaonic-vpn", "kaonic-wifi"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/beechat-network/kaonic-hub"

[workspace.dependencies]
# HTTP: the tokio project's stack.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "http1", "tokio", "service"] }
# TLS: rustls with ring, as the gateway already ships on this board.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reticulum-rs mesh fixes (link liveness, relay proofs); move to main once merged.
reticulum = { git = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs.git", branch = "fix/radio-mesh" }
# Same major as reticulum-rs.
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
# Same majors as reticulum-rs, so the hub links one copy of each.
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "fast", "zeroize"] }
libc = "0.2"
# ECDSA P-256 for release signatures; already in the tree under rustls.
ring = "0.17"
# SQLite is compiled in, so the hub does not depend on the image's libsqlite3 version.
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10.8"
tokio = { version = "1.53", default-features = false }
x509-cert = "0.2.5"
zeroize = "1.8"

[profile.release]
lto = true
codegen-units = 1
# A panic in any thread ends the process, so systemd restarts it (Restart=always) rather than
# a dead thread leaving a hub that looks alive but no longer hears the radio.
panic = "abort"
